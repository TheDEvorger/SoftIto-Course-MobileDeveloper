<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Pozisyonlama Mimarisi</title>
    <link rel="stylesheet" href="mobil_kart_ve_pozisyon.css">
</head>
<body>
    <header class="mobile-header">Keşfet ve Alışveriş Yap</header>

    <main class="feed">
        <div class="product-card">
        <span class="badge-discount">%40 İNDİRİM</span>
        <h3>Kablosuz Kulaklık</h3>
        <p class="product-description">Aktif gürültü engelleme &100 saat pil ömrü</p>
        <strong class="product-price">1.500 TL</strong>
        </div>

         <div class="product-card">
        <span class="badge-discount badge-new">Yeni</span>
        <h3>Akıllı Saat</h3>
        <p class="product-description">Nabız ölçümü ve tansiyon ölçümü</p>
        <strong class="product-price">1.799 TL</strong>
        </div>

        <button class="fab-btn">+</button>
        <nav class="bottom-navi">
            <span>Anasayfa</span>
            <span>Arama</span>
            <span>Sepetim</span>
            <span>Profil</span>
        </nav>
    </main>
</body>
</html>
