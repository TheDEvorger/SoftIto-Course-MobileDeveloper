name: Flutter quality
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python3 -m unittest discover -s server -t . -v
      - run: dart run tools/check_local_api.dart
      - run: flutter build web --release --no-web-resources-cdn
      - run: python3 tools/quality_gate.py
