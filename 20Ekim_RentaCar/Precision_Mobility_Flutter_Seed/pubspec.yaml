name: precision_mobility
description: Premium hybrid mobility platform design seed.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/precision-editorial-hero.png
    - assets/images/sample-touring.png
    - assets/images/sample-electric.png
    - assets/images/sample-suv.png
    - assets/images/sample-compact.png
    - assets/fonts/Roboto_LICENSE.txt
  fonts:
    - family: PrecisionRoboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
