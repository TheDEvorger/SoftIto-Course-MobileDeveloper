        const istasyonKW=50;
        const gunduzfiyatparametresi=20; //tl cinsinden
        const gecefiyatparametresi=30;   //tl cinsinden
        
        function tarifem(tarifePaketi){
            if (tarifePaketi=="gündüz"){return gunduzfiyatparametresi}
            else if(tarifePaketi=="gece"){return gecefiyatparametresi}
            else{return 0}
        }

        for(const arac in araclar){

            tarifem(araclar[arac].tarifePaketi)

            if(araclar[arac].hedefYuzde>araclar[arac].mevcutYuzde){
                const yuzdedolummiktari = araclar[arac].hedefYuzde-araclar[arac].mevcutYuzde;
                const kalandolumzamani = (yuzdedolummiktari/100*araclar[arac].bataryaKWh/istasyonKW*60).toFixed(2);
                const tutar=(kalandolumzamani*tarifem(araclar[arac].tarifePaketi)).toFixed(2);
