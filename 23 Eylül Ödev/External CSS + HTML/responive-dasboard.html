<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,
            initial-scale=1.0">
            <title>Bizim Sınıf Dashboard</title>
    <link rel="stylesheet" href="responive-dasboard.css">

            

        </head>

        <body>
            <div class="header-area">
                <div class="header-badge">
                    <span class="pulse-dot"></span>
                    <span>Canlı Borsa Devrede</span>
                    
                </div>

                <h1>Fintech Platformu</h1>

                <p class="header-subtitle">
                    Css Grid + Mobile First Query + Gpu 60 fps Animasyonlar
                </p>
            </div>

            <div class="dashboard-grid">
                <div class="glass-card">
                    <div class="card-top">
                        <span class="card-label">
                            Toplam Hakediş
                        </span>
                        <div class="card-icon">💼</div>
                    </div>

                    <div class="card-value">400.000 ₺</div>
                    <div class="card-footer">Betül Zaglı</div>
                </div>

                <div class="glass-card">
                    <div class="card-top">
                        <span class="card-label">
                            Selahaddin Ciro
                        </span>
                        <div class="card-icon">📈</div>
                    </div>

                    <div class="card-value">700.000 ₺</div>
                    <div class="card-footer">EPDK / Şarj Altyapı</div>
                </div>            
                
                <div class="glass-card">
                    <div class="card-top">
                        <span class="card-label">
                            Aktif Öğrenci
                        </span>
                        <div class="card-icon">🎓</div>
                    </div>

                    <div class="card-value">29 Geliştirici</div>
                    <div class="card-footer">11. Gün MasterClass</div>
                </div>


            </div>
        </body>
    </html>
